name: Scraping Programacao

permissions:
  contents: write

on:
  schedule:
    - cron: "*/15 * * * *" # Incremental: confere a programação a cada 15 min (só commita se mudou)
    - cron: "30 9 * * *" # Completo: 1x por dia (06:30 de Brasília) reabre todas as páginas internas
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Reabrir todas as páginas internas (títulos, plataformas e imagens)"
        type: boolean
        default: false

# Evita duas execuções ao mesmo tempo disputando o push
concurrency:
  group: scraping-programacao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # puppeteer 25 exige Node >= 22.12
          cache: npm

      - run: npm ci # Instala as dependências exatas do package-lock (inclui o Chrome do puppeteer)

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Scraping Script
        env:
          TZ: America/Sao_Paulo
          FULL_REFRESH: ${{ github.event.schedule == '30 9 * * *' || inputs.full_refresh == true }}
        run: node scraping.js
