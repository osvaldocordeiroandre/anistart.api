name: Scraping Programacao

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */3 * * *" # Roda a cada 3 horas (Ajuste conforme a necessidade de carga no servidor deles)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # puppeteer 25 exige Node >= 22.12
          cache: npm

      - run: npm ci # Instala as dependências exatas do package-lock (inclui o Chrome do puppeteer)

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Scraping Script
        env:
          TZ: America/Sao_Paulo
        run: node scraping.js
